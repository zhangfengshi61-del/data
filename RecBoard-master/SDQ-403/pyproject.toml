[project]
name = "sdq"
version = "0.1.0"
description = "Structure Diffusion Quantization"
requires-python = ">=3.10"
dependencies = [
    "freerec==0.9.7",
    "k-means-constrained==0.7.3",
    "networkx==3.2.1",
    "numpy==1.26.1",
    "pandas==2.0.1",
    "scipy==1.15.1",
    "sentence-transformers==5.5.1",
    "torch==2.6.0",
    "torch-geometric==2.7.0",
    "torchdiffeq==0.2.5",
    "transformers==5.9.0",
]

[project.optional-dependencies]
partitioning = [
    "igraph==1.0.0",
    "leidenalg==0.12.0",
    "pymetis==2025.2.2",
    "scikit-learn==1.6.1",
]
