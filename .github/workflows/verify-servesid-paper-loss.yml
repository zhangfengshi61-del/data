name: Verify ServeSID paper loss and reproducibility

on:
  push:
    paths:
      - "ServeSID/**"
      - ".github/workflows/verify-servesid-paper-loss.yml"
  pull_request:
    paths:
      - "ServeSID/**"
      - ".github/workflows/verify-servesid-paper-loss.yml"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m compileall -q ServeSID/sid_mlp ServeSID/tests
      - name: Canonical Full and baseline Bash syntax
        run: |
          bash -n ServeSID/scripts/train.sh.servesid
          bash -n ServeSID/scripts/train_kd_baselines_all_arches.sh
          # The Full launcher must load this checkout's canonical sid_mlp module.
          ! grep -q 'repos/SID-MLP\|code/sid-mlp-distill' ServeSID/scripts/train.sh.servesid
      - name: Stdlib loss, cost, and validation policy tests
        run: |
          python -m unittest discover -s ServeSID/tests -p "test_paper_loss_contract.py" -v
          python -m unittest discover -s ServeSID/tests -p "test_cost_audit_contract.py" -v
          python -m unittest discover -s ServeSID/tests -p "test_validation_selection.py" -v

  cpu-backbone-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tqdm
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Actual MLP/GRU/CNN forward-backward and checkpoint inference replay
        env:
          PYTHONPATH: ServeSID
        run: python -m unittest discover -s ServeSID/tests -p "test_*cpu*.py" -v
      - name: Confirm manuscript student parameter counts
        env:
          PYTHONPATH: ServeSID
        run: python ServeSID/scripts/count_student_parameters.py
