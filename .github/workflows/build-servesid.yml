name: Build canonical ServeSID submission

on:
  push:
    branches: [main]
    paths:
      - "ServeSID-www/**"
      - "ServeSID/**"
      - ".github/workflows/build-servesid.yml"
      - "README.md"
  pull_request:
    paths:
      - "ServeSID-www/**"
      - "ServeSID/**"
      - ".github/workflows/build-servesid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate the single canonical manuscript from its data
        run: |
          python3 ServeSID-www/scripts/gen_tables.py
          python3 ServeSID-www/scripts/check_sensitivity_references.py
          python3 ServeSID-www/scripts/check_rank_metric_invariants.py
          python3 ServeSID-www/scripts/gen_submission_appendix.py
      - name: Check that generated tables match committed source tables
        run: |
          git diff --exit-code -- \
            ServeSID-www/Figures/table_main_results.tex \
            ServeSID-www/Figures/table_supp_main.tex \
            ServeSID-www/Figures/table_ablation.tex \
            ServeSID-www/Figures/table_supp_ablation.tex
      - name: Build cropped vector figures
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          fig = Path("ServeSID-www/Figures")
          pairs = [
              ("ServeSID_Figure1_Hierarchy_only.svg", "diag_hierarchy.pdf"),
              ("figure_no_title_background_vector.svg", "fig_stat_h1.pdf"),
              ("depthwise_residuals_no_header_bg_vector.svg", "fig_stat_d12.pdf"),
              ("image2.svg", "diag_replace.pdf"),
          ]
          for src, dst in pairs:
              cairosvg.svg2pdf(url=str(fig / src), write_to=str(fig / dst))
          PY
      - name: Compile ONLY the single-file WWW submission
        uses: xu-cheng/latex-action@v3
        with:
          root_file: submission.tex
          working_directory: ServeSID-www
          latexmk_use_xelatex: false
          args: -pdf -bibtex -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Audit page budget and figure/table placement
        run: |
          python -m pip install --quiet pymupdf
          python3 ServeSID-www/scripts/check_www_layout.py ServeSID-www/submission.pdf
      - name: Publish the ONE submission PDF with QA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ServeSID-submission-PDF
          path: |
            ServeSID-www/submission.pdf
            ServeSID-www/layout_audit.txt
            ServeSID-www/metric_invariant_audit.txt
            ServeSID-www/layout_previews/*.png
          if-no-files-found: error
