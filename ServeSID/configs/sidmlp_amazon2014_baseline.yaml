# Plain SID-MLP baseline for the Amazon2014 A/B comparison.
# Identical hyperparameters to servesid_final.yaml (200 epochs), but WITHOUT
# the three ServeSID serving-list losses (serve_kl / pair / DA-CDRS).
# Pure digit distillation: combined loss (KL + CE, alpha 0.7), d4 combined.

dataset: Amazon2014
category: null
dataset_tag: null
val_dataset_tag: null

num_heads: 4
attn_dim: 384
ffn_dim: 1024
head_hidden: 512
head_layers: 1
dropout: 0.2
loss: combined
temperature: 1.0
alpha: 0.7
d4_teacher: combined

lr: 5e-5
weight_decay: 1e-4
epochs: 200
batch_size: 512
val_batch_size: 32
beam_size: 50
final_top_n: 50
grad_clip: 1.0
storage_fp16: false
seed: 42
