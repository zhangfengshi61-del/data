# HCDA+AbsRes (paper ablation): seed and data artifacts must match the published run.
dataset: Amazon2014
category: Beauty
dataset_tag: Amazon2014_Beauty
val_dataset_tag: Amazon2014_Beauty_val

num_heads: 4
attn_dim: 384
ffn_dim: 1024
head_hidden: 512
head_layers: 1
dropout: 0.2
loss: ce
temperature: 1.0
alpha: 0.7
d4_teacher: ce

lr: 5e-5
weight_decay: 1e-4
epochs: 200
batch_size: 512
val_batch_size: 32
beam_size: 50
final_top_n: 50
grad_clip: 1.0
storage_fp16: false
seed: 42

list_kl: 0
prefix_kl: 0
serve_kl: 4
serve_w1: 1
serve_w2: 1
serve_w3: 1
serve_w4: 1

pair_w: 0.0
pair_gamma: 0.05
pair_margin: 0.05  # Plain Pair control: softplus(mu-G), not temperature scaling
pair_k: 10
pair_b: 40
pair_negs: 0

cdrs_pos_k: 10
cdrs_neg_end: 40
da_w: 1.0
da_mode: cf
da_gamma: 0.05
da_huber: 1.0
da_negs: 0
da_corr_w: 31.42
da_margin: 0.05
corr_mode: absres
list_topm: 64
list_temp: 1.0
seeds: [42, 43, 44]
